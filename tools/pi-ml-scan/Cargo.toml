[package]
name = "pi-ml-scan"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tract-onnx = { version = "0.21", default-features = false }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
